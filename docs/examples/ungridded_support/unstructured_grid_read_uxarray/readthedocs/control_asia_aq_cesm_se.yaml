analysis:
  start_time: '2024-03-26'
  end_time: '2024-03-27 23:59:00'
  
  output_dir: ./output/asia_aq_cesmse
  output_dir_save: ./output/asia_aq_cesmse
  output_dir_read: ./output/asia_aq_cesmse
  
  read:
    paired:
      method: netcdf
      filenames:
        dc8_cam-chem-se-era5:
        - /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/dc8_plot_yaml/pruned/20240331_asiaaq_20240331_dc8_cam-chem-se-era5.nc4
        dc8_cam-chem-se-merra2:
        - /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/dc8_plot_yaml/pruned/20240331_asiaaq_20240331_dc8_cam-chem-se-merra2.nc4
        
  download_maps: false
  debug: false
  
#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se-era5:
    files:
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-27-03600.nc

    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 14000

    # different interpolation options 
    vertical_interp: 'log-linear'   # linear ; nearest ; log-linear   (https://github.com/NCAR/MELODIES-MONET/issues/116)
    horizontal_interp: 'idw'        # nearest ; idw                   (https://github.com/NCAR/MELODIES-MONET/issues/113)
    horizontal_neighbors: 4         # k for idw
    idw_power: 2.0                  # weighting exponent
    
    mapping: 
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'

    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

  cam-chem-se-merra2:
    files:
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.2024-03-27-03600.nc
      
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    
    radius_of_influence: 100000
        
    mapping:
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'
        
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'magenta'
      marker: 'x'
      linestyle: '--'
      
#-------------------------------------------------------------------
# Observation definitions
obs:
  dc8:
    filename: '/glade/campaign/acom/acom-weather/emmons/ASIAAQ_obs/DC8/asiaaq-mrg10_dc8_20240327_RA_20260509.ict' 
    obs_type: aircraft
    time_var: Time_Start
    resample: '60s'                        #  1-min means before pairing
    variables:
      Latitude_BENNETT:  {rename: latitude,  nan_value: -999999}
      Longitude_BENNETT: {rename: longitude, nan_value: -999999}
      Static_Pressure_BENNETT:
        rename: pressure_obs
        unit_scale: 100              # hPa to  Pa
        unit_scale_method: '*'
        nan_value: -999999
      Pressure_Altitude_BENNETT:
        rename: altitude
        unit_scale: 0.3048           # ft to m
        unit_scale_method: '*'
        nan_value: -999999
      Static_Air_Temp_BENNETT:
        rename: temperature
        unit_scale: 273.15           
        unit_scale_method: '+'
        nan_value: -999999
      O3_ppbv_FRANCHIN:
        rename: O3
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -999999
        ylabel_plot: 'O3 (ppb)'
        vmin_plot: 0
        vmax_plot: 120
        ty_scale: 1.5
      CO_DACOM_DISKIN:
        rename: CO
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -999999
        ylabel_plot: 'CO (ppb)'
        vmin_plot: 0
        vmax_plot: 400
        ty_scale: 1.5
      NO2_pptv_FRANCHIN:
        rename: NO2
        unit_scale: 0.001              # pptv to ppb
        unit_scale_method: '*'
        nan_value: -999999
        ylabel_plot: 'NO2 (ppb)'
        vmin_plot: 0
        vmax_plot: 10
        ty_scale: 1.5
        
plots:
  curtain_dc8_pa_ph:
    type: 'curtain'
    fig_kwargs: {figsize: [20, 8]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2']
    color_map: "cividis"
    vert_coord: "pressure"
    pressure_units: 'Pa'
    interval: 10000       
    num_levels: 100
    data_proc: {rem_obs_nan: True, set_axis: True}

  curtain_dc8_m_ph:
    type: 'curtain'
    fig_kwargs: {figsize: [20, 8]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2']
    color_map: "cividis"
    vert_coord: 'altitude'      # 'altitude' (m) or 'pressure' 
    altitude_units: 'm'         # label only
    interval: 2000              # y-tick spacing 
    num_levels: 100
    data_proc: {rem_obs_nan: true, set_axis: true}  

  curtain_dc8_pa_th:
    type: 'curtain'
    fig_kwargs: {figsize: [20, 8]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-era5']
    color_map: "cividis"
    vert_coord: "pressure"
    pressure_units: 'Pa'
    interval: 10000       
    num_levels: 100
    data_proc: {rem_obs_nan: True, set_axis: True}

  curtain_dc8_m_th:
    type: 'curtain'
    fig_kwargs: {figsize: [20, 8]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2']
    color_map: "cividis"
    vert_coord: 'altitude'      # 'altitude' (m) or 'pressure' 
    altitude_units: 'm'         # label only
    interval: 2000              # y-tick spacing 
    num_levels: 100
    data_proc: {rem_obs_nan: true, set_axis: true} 
    
