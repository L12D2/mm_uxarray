plots:
  plt_grp1:
    type: 'spatial_dist'
    fig_kwargs:
      states: True
      counties: True
      extent: [86, 144, -14, 46]  # Lon,Lon,Lat,Lat
      cmap: 'Spectral_r'
    text_kwargs:
      fontsize: 16
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ['tropomi_l2_no2_cesm_fv']
    data_proc:
      set_axis: False
      vmin_plot: 0
      vmax_plot: 6.0e+15
  
  plt_grp2:
    type: 'gridded_spatial_bias'
    fig_kwargs:
      states: True
      counties: True
      cmap: 'RdBu_r'
    text_kwargs:
      fontsize: 16  
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ['tropomi_l2_no2_cesm_fv']
    data_proc:
      set_axis: False
      vdiff_plot: 2.0e+15

  plot_grp5:
    type: 'timeseries'
    fig_kwargs:
      figsize: [12,6]
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.
    text_kwargs:
      fontsize: 18.
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ["tropomi_l2_no2_cesm_fv"]
    data_proc:
      set_axis: False
      vmin_plot: 0
      vmax_plot: 6.0e+15
     
stats:
  stat_list: ["MB", "MdnB", "R2", "RMSE"]
  round_output: 2 # optional; defaults to rounding to 3rd decimal place
  output_table: True
  output_table_kwargs: # optional
    figsize: [7, 3]
    fontsize: 12.
    xscale: 1.4
    yscale: 1.4
    edges: "horizontal"
    format: "{:.2e}" #"{.2f}", it would be a float with 2 decimal digits
  domain_type: ["all"]       #"auto-region:box"]
  domain_name: ["ASIA-AQ"]   #, "Thailand"]
  domain_info:
    Thailand:
      bounds: [97, 106, 5, 20]
  data: ["tropomi_l2_no2_cesm_fv"]
