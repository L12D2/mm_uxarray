      method: 'netcdf'
      filenames: 
        {tropomi_l2_co_cesm_fv: ['tropomi_l2_CO_cesm_fv.nc4']}
  pairing_kwargs:
     sat_swath_clm:
        apply_ak: True
        mod_to_overpass: True
model:
  cam-chem-se:
    files:
      - /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-01-01-03600.nc
      - /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-01-02-03600.nc
 
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne0CONUSne30x8/ne0CONUS_ne30x8_np4_SCRIP.nc"
    mapping:
      tropomi_l2_co:
        CO: "carbonmonoxide_total_column_corrected"
    projection: null
    mod_kwargs:
      surf_only: False
      convert_to_ppb: True    

obs:
  tropomi_l2_co:
    debug: True
    filename: /glade/campaign/acom/acom-da/rkumar/ASIA_AQ_Post/tropomi_data/S5P_OFFL_L2__CO_____20240319*
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_co
    sat_method: apply_ak
    apply_ak: True
    variables:
      "carbonmonoxide_total_column_corrected": {"quality_flag": "qa_value", "qa_thresh_min": 0.5}
      "column_averaging_kernel": {}
      "qa_value": {}

plots:
  plt_grp1:
    type: 'spatial_dist'
    fig_kwargs:
      states: True
      counties: True
      extent: [86, 144, -14, 46]  # Lon,Lon,Lat,Lat
      cmap: 'Spectral_r'
    text_kwargs:
      fontsize: 16
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ['tropomi_l2_co_cesm_fv']
    data_proc:
      set_axis: False
      vmin_plot: 0
      vmax_plot: 6.0e+15
  
  plt_grp2:
    type: 'gridded_spatial_bias'
    fig_kwargs:
      states: True
      counties: True
      cmap: 'RdBu_r'
    text_kwargs:
      fontsize: 16  
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ['tropomi_l2_co_cesm_fv']
    data_proc:
      set_axis: False
      vdiff_plot: 2.0e+15

  plot_grp5:
    type: 'timeseries'
    fig_kwargs:
      figsize: [12,6]
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.
    text_kwargs:
      fontsize: 18.
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ["tropomi_l2_co_cesm_fv"]
    data_proc:
      set_axis: False
      vmin_plot: 0
      vmax_plot: 6.0e+15
     
stats:
  stat_list: ["MB", "MdnB", "R2", "RMSE"]
  round_output: 2 # optional; defaults to rounding to 3rd decimal place
  output_table: True
  output_table_kwargs: # optional
    figsize: [7, 3]
    fontsize: 12.
    xscale: 1.4
    yscale: 1.4
    edges: "horizontal"
    format: "{:.2e}" #"{.2f}", it would be a float with 2 decimal digits
  domain_type: ["all"]       #"auto-region:box"]
  domain_name: ["ASIA-AQ"]   #, "Thailand"]
  domain_info:
    Thailand:
      bounds: [97, 106, 5, 20]
  data: ["tropomi_l2_co_cesm_fv"]
