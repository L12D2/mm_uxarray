analysis:
  start_time: '2024-04-18'
  end_time: '2024-04-19'
  debug: true
  output_dir: '/glade/derecho/scratch/gaubert/tropomi_files/cesm-fv/f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01'
  output_dir_save: '/glade/derecho/scratch/gaubert/tropomi_files/cesm-fv/f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01'
  output_dir_read: '/glade/derecho/scratch/gaubert/tropomi_files/cesm-fv/f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01'
  save:
    paired:
      method: 'netcdf'
      prefix: '20240418'
      data: all
  read:
    paired:
      method: 'netcdf'
      filenames: {tropomi_l2_co_cesm_fv: ['tropomi_l2_CO_cesm_fv.nc4']}
  pairing_kwargs:
    sat_swath_clm:
      apply_ak: true
      mod_to_overpass: true
model:
  cesm_fv:
    files:
      - /glade/derecho/scratch/emmons/archive/f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01/atm/hist//f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01.cam.h2i.2024-04-17-03600.nc
      - /glade/derecho/scratch/emmons/archive/f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01/atm/hist//f.e3b06m.FCnudged.t1s.camsm1_finn26.2023.f09.01.cam.h2i.2024-04-18-03600.nc
    mod_type: 'cesm_fv'
    mapping:
      tropomi_l2_co:
        CO: "carbonmonoxide_total_column_corrected"
    projection:
    mod_kwargs:
      surf_only: false
      convert_to_ppb: true

obs:
  tropomi_l2_co:
    debug: true
    filename: 
      /glade/campaign/acom/acom-da/rkumar/ASIA_AQ_Post/tropomi_data/S5P_OFFL_L2__CO____20240418*
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_co
    sat_method: apply_ak
    apply_ak: true
    variables:
      "carbonmonoxide_total_column_corrected": {"quality_flag": "qa_value", "qa_thresh_min": 
          0.5}
      "column_averaging_kernel": {}
      "qa_value": {}

plots:
  plt_grp1:
    type: 'spatial_dist'
    fig_kwargs:
      states: true
      counties: true
      extent: [86, 144, -14, 46]  # Lon,Lon,Lat,Lat
      cmap: 'Spectral_r'
    text_kwargs:
      fontsize: 16
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ['tropomi_l2_co_cesm_fv']
    data_proc:
      set_axis: false
      vmin_plot: 0
      vmax_plot: 6.0e+15

  plt_grp2:
    type: 'gridded_spatial_bias'
    fig_kwargs:
      states: true
      counties: true
      cmap: 'RdBu_r'
    text_kwargs:
      fontsize: 16
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ['tropomi_l2_co_cesm_fv']
    data_proc:
      set_axis: false
      vdiff_plot: 2.0e+15

  plot_grp5:
    type: 'timeseries'
    fig_kwargs:
      figsize: [12, 6]
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.
    text_kwargs:
      fontsize: 18.
    domain_type: ["all"]       #"auto-region:box"]
    domain_name: ["ASIA-AQ"]   #, "Thailand"]
    domain_info:
      Thailand:
        bounds: [97, 106, 5, 20]
    data: ["tropomi_l2_co_cesm_fv"]
    data_proc:
      set_axis: false
      vmin_plot: 0
      vmax_plot: 6.0e+15

stats:
  stat_list: ["MB", "MdnB", "R2", "RMSE"]
  round_output: 2 # optional; defaults to rounding to 3rd decimal place
  output_table: true
  output_table_kwargs: # optional
    figsize: [7, 3]
    fontsize: 12.
    xscale: 1.4
    yscale: 1.4
    edges: "horizontal"
    format: "{:.2e}" #"{.2f}", it would be a float with 2 decimal digits
  domain_type: ["all"]       #"auto-region:box"]
  domain_name: ["ASIA-AQ"]   #, "Thailand"]
  domain_info:
    Thailand:
      bounds: [97, 106, 5, 20]
  data: ["tropomi_l2_co_cesm_fv"]
