#-------------------------------------------------------------------
# Observation definitions
obs:
  thailand_bma:
    use_airnow: true
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/thai_data/thai_aws_airnow_qc.nc
    
    obs_type: pt_sfc
    variables:
      temperature:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Temperature (K)'
        # vmin_plot: 280
        # vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20
      
      O3:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'Ozone (Ppb)'
        # vmin_plot: 0
        # vmax_plot: 100
        vdiff_plot: 5
        nlevels_plot: 20

      PM2.5: # check these units for thai. Multiplying by 1e9 makes them too big but docs say the si units are ug/m^3
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'PM2.5 (ug/m^3)'
        # vmin_plot: 0
        # vmax_plot: 500
        vdiff_plot: 5
        nlevels_plot: 20
        
      dewpoint_qc:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Dewpoint (K)'
        # vmin_plot: 280
        # vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20  
        
  philippines_aws:
    use_airnow: true
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/philippines_data/philippines_aws_airnow_qc.nc
    
    obs_type: pt_sfc
    variables:
      temperature:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Temperature (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20

      dewpoint_qc:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Dewpoint (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20  

  dc8:
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/dc8_data/asiaaq_dc8_merge_all.nc
    obs_type: aircraft
    resample: '60s'                        #  1-min means before pairing
    variables:
      pressure_obs: {}                     # Pa; required by vert_interp (join key)
      altitude: {}                         # m; used by vertprofile/curtain altitude_variable
      O3:  {unit_scale: 1,  unit_scale_method: '*' }
      CO:  {unit_scale: 1,  unit_scale_method: '*' }
      #NO:  {unit_scale: 0.001, unit_scale_method: '*' }
      NO2: {unit_scale: 0.001, unit_scale_method: '*' }

        
        
#-------------------------------------------------------------------
# Define which comparisons/plots to complete:
# Any key that is specific for a plot type will begin with ts for timeseries, ty for taylor
# Opt: Specifying the variable or variable group is optional
# For now all plots except time series average over the analysis window. 
# Setting axis values - If set_axis = True in data_proc section of each plot_grp the yaxis for the plot will be set based on the values specified in the obs section for each variable. If set_axis is set to False, then defaults will be used. 'vmin_plot' and 'vmax_plot' are needed for 'timeseries', 'spatial_overlay', and 'boxplot'. 'vdiff_plot' is needed for 'spatial_bias' plots and'ty_scale' is needed for 'taylor' plots. 'nlevels' or the number of levels used in the contour plot can also optionally be provided for spatial_overlay plot. If set_axis = True and the proper limits are not provided in the obs section, a warning will print, and the plot will be created using the default limits.

