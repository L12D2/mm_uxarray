#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se:
    files:
      # - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.2024-03-31-03600.nc
      
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-29-03600.nc
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-30-03600.nc
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-31-03600.nc

    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"

    # /glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc
    
    radius_of_influence: 27794 #meters: horizontal resolution * 1.5
    mapping: #model species name : obs species name
      airnow:
        T: 'temperature'
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

#-------------------------------------------------------------------
# Observation definitions
obs:
  airnow: # obs label
    use_airnow: true
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/thai_data/thailand_bma_airnow.nc
    
    #/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/philippines_data/philippines_aws_airnow.nc

    obs_type: pt_sfc
    variables: #Opt
      temperature:
        unit_scale: 273.15 #Opt Scaling factor 
        unit_scale_method: '+' #Opt Multiply = '*' , Add = '+', subtract = '-', divide = '/'
        nan_value: -1.0 # Opt Set this value to NaN
        ylabel_plot: 'Temperature (K)'
        vmin_plot: 285 #Opt Min for y-axis during plotting. To apply to a plot, change restrict_yaxis = True.
        vmax_plot: 315 #Opt Max for y-axis during plotting. To apply to a plot, change restrict_yaxis = True.
        vdiff_plot: 5 #Opt +/- range to use in bias plots. To apply to a plot, change restrict_yaxis = True.
        nlevels_plot: 5 #Opt number of levels used in colorbar for contourf plot.

#-------------------------------------------------------------------
# Define which comparisons/plots to complete:
# Any key that is specific for a plot type will begin with ts for timeseries, ty for taylor
# Opt: Specifying the variable or variable group is optional
# For now all plots except time series average over the analysis window. 
# Setting axis values - If set_axis = True in data_proc section of each plot_grp the yaxis for the plot will be set based on the values specified in the obs section for each variable. If set_axis is set to False, then defaults will be used. 'vmin_plot' and 'vmax_plot' are needed for 'timeseries', 'spatial_overlay', and 'boxplot'. 'vdiff_plot' is needed for 'spatial_bias' plots and'ty_scale' is needed for 'taylor' plots. 'nlevels' or the number of levels used in the contour plot can also optionally be provided for spatial_overlay plot. If set_axis = True and the proper limits are not provided in the obs section, a warning will print, and the plot will be created using the default limits.
plots:
  
  plot_grp1:
    type: 'timeseries' # plot type
    fig_kwargs: #Opt to define figure options
      figsize: [12, 6] # figure size if multiple plots
          
      #extent: [86, 144, -14, 46]
      
    default_plot_kwargs: # Opt to define defaults for all plots. Model kwargs overwrite these.
      linewidth: 2.0
      markersize: 10.
    text_kwargs: #Opt
      fontsize: 18.
    # domain_type: ['all', 'epa_region', 'state_name'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    # domain_name: ['CONUS', 'R8', 'CO'] #List of domain names. If domain_type = all domain_name is used in plot title.

    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['model'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    data: ['airnow_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      #ts_select_time: 'time_local' #Time used for avg and plotting: Options: 'time' for UTC or 'time_local'
      ts_select_time: 'time'   
      
      ts_avg_window: 'h' # Options: None for no averaging or list pandas resample rule (e.g., 'h', 'D')
      set_axis: false #If select True, add vmin_plot and vmax_plot for each variable in obs.
  
  plot_grp2:
    type: 'taylor' # plot type
    fig_kwargs: #Opt to define figure options
      figsize: [8, 8] # figure size if multiple plots
      
    default_plot_kwargs: # Opt to define defaults for all plots. Model kwargs overwrite these.
      linewidth: 2.0
      markersize: 10.
    text_kwargs: #Opt
      fontsize: 16.
    # domain_type: ['all', 'epa_region', 'state_name'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    # domain_name: ['CONUS', 'R8', 'CO'] #List of domain names. If domain_type = all domain_name is used in plot title.

    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['model'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    data: ['airnow_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: true #If select True, add ty_scale for each variable in obs.
  
  plot_grp3:
    type: 'spatial_bias' # plot type
    fig_kwargs: #For all spatial plots, specify map_kwargs here too.
      states: false
      counties: false 
      extent: [86, 144, -14, 46]
      figsize: [10, 5] # figure size 
    text_kwargs: #Opt
      fontsize: 16.
    # domain_type: ['all', 'epa_region', 'state_name'] #List of domain types: . (e.g., airnow: epa_region, state_name, siteid, etc.) 
    # domain_name: ['CONUS', 'R8', 'CO'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['model'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    data: ['airnow_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: true #If select True, add vdiff_plot for each variable in obs.
  
  plot_grp4:
    type: 'spatial_overlay' # plot type
    fig_kwargs: #For all spatial plots, specify map_kwargs here too.
      figsize: [10, 5] # figure size 
      
      states: false
      counties: false
      extent: [86, 144, -14, 46]
      
    text_kwargs: #Opt
      fontsize: 16.
    # domain_type: ['all', 'epa_region', 'state_name'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    # domain_name: ['CONUS', 'R8', 'CO'] #List of domain names. If domain_type = all domain_name is used in plot title.

    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['model'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    data: ['airnow_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: true #If select True, add vmin_plot and vmax_plot for each variable in obs.
  
  plot_grp5:
    type: 'boxplot' # plot type
    fig_kwargs: #Opt to define figure options
      figsize: [8, 6] # figure size       
    text_kwargs: #Opt
      fontsize: 20.
    # domain_type: ['all', 'epa_region', 'state_name'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region etc.) 
    # domain_name: ['CONUS', 'R8', 'CO'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['model'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    data: ['airnow_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: false #If select True, add vmin_plot and vmax_plot for each variable in obs.


