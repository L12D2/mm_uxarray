
#-------------------------------------------------------------------
# Universal comparison variables
analysis:
  start_time: '2024-03-20'          #UTC
  end_time: '2024-03-31 23:59:00'          #UTC
  
  output_dir: 
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output
  output_dir_save: 
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output
  output_dir_read: 
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output

  save:
    paired:
      method: 'netcdf'
      prefix: '20240331'
      data: all
  read:
    paired:
      method: 'netcdf'
