  ts_th:
    type: 'timeseries'
    fig_kwargs: {figsize: [12, 6]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    domain_type: ['all']
    domain_name: ['Thailand']          # title label only
    data: ['thailand_bma_cam-chem-se-merra2', "thailand_bma_cam-chem-se-era5"]
    data_proc: {rem_obs_nan: true, ts_select_time: 'time_local', ts_avg_window: 'h', set_axis: false}

