
#-------------------------------------------------------------------
# Universal comparison variables
analysis:
  start_time: '2024-01-31'                 #UTC  
  end_time:   '2024-04-01 23:59:00'        #UTC      

  output_dir:
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_plot
  output_dir_save:
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_plot
  output_dir_read:
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair

  # pair
  save:
    paired:
      method: 'netcdf'
      prefix: 'asiaaq'
      data: all

  # plot
  read:
    paired:
      method: 'netcdf'
      filenames:
        thailand_bma_cam-chem-se-era5:     ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_thailand_bma_cam-chem-se-era5.nc4']
        thailand_bma_cam-chem-se-merra2:   ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_thailand_bma_cam-chem-se-merra2.nc4']
        
        philippines_aws_cam-chem-se-era5:  ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_philippines_aws_cam-chem-se-era5.nc4']
        philippines_aws_cam-chem-se-merra2: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_philippines_aws_cam-chem-se-merra2.nc4']
                
  download_maps: false
  debug: false

#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se-era5:
    files:
    # swhould add a safe guard that if you're reading a paired file dont need this
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-29-03600.nc

    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 200000

    extra_calc: # Add more complex calculations and their associated variables here.
      dewpoint:
        pres_calc: "PS"
        specific_hum: "Q"
        
    mapping:
      thailand_bma:
        T: 'temperature'
        O3: "O3"
        PM25: "PM2.5"
        dewpoint: "dewpoint_qc"
        
      philippines_aws:
        T: 'temperature'
        dewpoint: "dewpoint_qc"
      
      dc8:
        O3: 'O3'
        CO: 'CO'
        #NO: 'NO'
        NO2: 'NO2'
        T: 'temperature'

    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

  cam-chem-se-merra2:
    files:
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.2024-03-29-03600.nc
      
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    
    radius_of_influence: 200000

    # extra_calc: # Add more complex calculations and their associated variables here.
    #   dewpoint:
    #     pres_calc: "PS"
    #     specific_hum: "Q"
        
    mapping:
      thailand_bma:
        T: 'temperature'
        O3: "O3"
        PM25: "PM2.5"
        #dewpoint: "dewpoint_qc"
        
      philippines_aws:
        T: 'temperature'
        #dewpoint: "dewpoint_qc"

      dc8:
        O3: 'O3'
        CO: 'CO'
        #NO: 'NO'
        NO2: 'NO2'
        T: 'temperature'
        
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'magenta'
      marker: 'x'
      linestyle: '--'

      
#-------------------------------------------------------------------
# Observation definitions
obs:
  thailand_bma:
    use_airnow: true
    filename: '' #/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/thai_data/thai_aws_airnow_qc.nc
    
    obs_type: pt_sfc
    variables:
      temperature:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Temperature (K)'
        # vmin_plot: 280
        # vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20
      
      O3:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'Ozone (Ppb)'
        # vmin_plot: 0
        # vmax_plot: 100
        vdiff_plot: 5
        nlevels_plot: 20

      PM2.5: # check these units for thai. Multiplying by 1e9 makes them too big but docs say the si units are ug/m^3
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'PM2.5 (ug/m^3)'
        # vmin_plot: 0
        # vmax_plot: 500
        vdiff_plot: 5
        nlevels_plot: 20
        
      dewpoint_qc:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Dewpoint (K)'
        # vmin_plot: 280
        # vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20  
        
  philippines_aws:
    use_airnow: true
    filename: '' #/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/philippines_data/philippines_aws_airnow_qc.nc
    
    obs_type: pt_sfc
    variables:
      temperature:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Temperature (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20

      dewpoint_qc:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Dewpoint (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20          
        
