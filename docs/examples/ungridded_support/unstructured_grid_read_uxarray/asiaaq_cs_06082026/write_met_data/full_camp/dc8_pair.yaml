#-------------------------------------------------------------------
# MELODIES-MONET control file: DC8 aircraft vs CESM-SE/CAM-chem
# (GEMSne30x8 / ERA5  and  ne30pg3 / MERRA2) for asia AQ field camp 
# added sfc pairing too 
#-------------------------------------------------------------------
analysis:
  # start_time: '2024-01-01'                 #UTC  
  # end_time: '2024-04-01 23:59:00'          #UTC

  start_time: '2024-01-01'                 #UTC  
  end_time: '2024-01-31 23:59:00'          #UTC

  output_dir:
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/dc8_full_camp_pair
  output_dir_save:
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/dc8_full_camp_pair
  output_dir_read:
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/dc8_full_camp_pair

  # an.save()
  save:
    paired:
      method: 'netcdf'
      prefix: 'asiaaq'
      data: all

  # an.read
  read:
    paired:
      method: 'netcdf'
      filenames:
        dc8_cam-chem-se-era5:   ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/asiaaq_dc8_dc8_cam-chem-se-era5.nc4']
        dc8_cam-chem-se-merra2: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/asiaaq_dc8_dc8_cam-chem-se-merra2.nc4']

  download_maps: false
  debug: false

#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se-era5:
    files:
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-29-03600.nc
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-30-03600.nc
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.2024-03-31-03600.nc

    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 14000

    # extra_calc: # Add more complex calculations and their associated variables here.
    #   dewpoint:
    #     pres_calc: "PS"
    #     specific_hum: "Q"
    
    mapping: 
      dc8:
        O3: 'O3'
        CO: 'CO'
        #NO: 'NO'
        NO2: 'NO2'
        T: 'temperature'

    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

  cam-chem-se-merra2:
    files:
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.2024-03-29-03600.nc
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.2024-03-30-03600.nc
      - /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.2024-03-31-03600.nc
      
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    
    radius_of_influence: 100000
        
    mapping:
      dc8:
        O3: 'O3'
        CO: 'CO'
        #NO: 'NO'
        NO2: 'NO2'
        T: 'temperature'
        
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'magenta'
      marker: 'x'
      linestyle: '--'

#-------------------------------------------------------------------
# Observation definitions
obs:
  dc8:
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/dc8_data/asiaaq_dc8_merge_all.nc
    obs_type: aircraft
    resample: '60s'                        #  1-min means before pairing
    variables:
      pressure_obs: {}                     # Pa; required by vert_interp (join key)
      altitude: {}                         # m; used by vertprofile/curtain altitude_variable
      O3:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'O3 (ppb)'
        vmin_plot: 0
        vmax_plot: 120
        ty_scale: 1.5
      CO:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'CO (ppb)'
        vmin_plot: 0
        vmax_plot: 400
        ty_scale: 1.5
      #"NO":
      #  unit_scale: 0.001                  
      #  unit_scale_method: '*'
      #  ylabel_plot: 'NO (ppb)'
      NO2:
        unit_scale: 0.001                  
        unit_scale_method: '*'
        ylabel_plot: 'NO2 (ppb)'
        vmin_plot: 0
        vmax_plot: 10
        ty_scale: 1.5