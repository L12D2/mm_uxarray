#-------------------------------------------------------------------
# MELODIES-MONET: surface (Thailand BMA + Philippines AWS) vs CESM-SE
# (GEMSne30x8/ERA5 and ne30pg3/MERRA2) 

# glob all daily model files for the window and pair in one run.
#-------------------------------------------------------------------
analysis:
  start_time: '2024-01-31'                 #UTC  
  end_time:   '2024-04-01 23:59:00'        #UTC

  output_dir:       /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_plot
  output_dir_save:  /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair
  output_dir_read:  /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair

  save:
    paired: {method: 'netcdf', prefix: 'asiaaq_sfc', data: all}

  read:
    paired:
      method: 'netcdf'
      filenames:
        thailand_bma_cam-chem-se-era5:     ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_thailand_bma_cam-chem-se-era5.nc4']
        thailand_bma_cam-chem-se-merra2:   ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_thailand_bma_cam-chem-se-merra2.nc4']
        philippines_aws_cam-chem-se-era5:  ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_philippines_aws_cam-chem-se-era5.nc4']
        philippines_aws_cam-chem-se-merra2: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/sfc_full_camp_pair/asiaaq_sfc_philippines_aws_cam-chem-se-merra2.nc4']

  download_maps: false
  debug: false

#-------------------------------------------------------------------
model:
  cam-chem-se-era5:
    # glob ALL Feb+Mar daily files 
    files: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.*-03600.nc
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 14000
    surf_only: true                    # surface pairing only needs the bottom level
    extra_calc:
      dewpoint:
        pres_calc: "PS"
        specific_hum: "Q"
    mapping:
      thailand_bma:
        T: 'temperature'
        O3: 'O3'
        PM25: 'PM2.5'
        dewpoint: 'dewpoint_qc'
      philippines_aws:
        T: 'temperature'
        dewpoint: 'dewpoint_qc'
    projection: ~
    plot_kwargs: {color: 'dodgerblue', marker: '+', linestyle: '-.'}

  cam-chem-se-merra2:
    files: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.*-03600.nc
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    radius_of_influence: 100000
    surf_only: true
    mapping:
      thailand_bma:
        T: 'temperature'
        O3: 'O3'
        PM25: 'PM2.5'
      philippines_aws:
        T: 'temperature'
    projection: ~
    plot_kwargs: {color: 'magenta', marker: 'x', linestyle: '--'}

#-------------------------------------------------------------------
obs:
  thailand_bma:
    use_airnow: true
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/thai_data/thai_aws_airnow_qc.nc
    obs_type: pt_sfc
    variables:
      temperature:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Temperature (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20
      O3:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'Ozone (ppb)'
        vmin_plot: 0
        vmax_plot: 100
        vdiff_plot: 5
        nlevels_plot: 15
      PM2.5:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: 'PM2.5 (ug/m^3)'
        vmin_plot: 0
        vmax_plot: 500
        vdiff_plot: 5
        nlevels_plot: 15
      dewpoint_qc:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Dewpoint (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 15

  philippines_aws:
    use_airnow: true
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/preprocessing/philippines_data/philippines_aws_airnow_qc.nc
    obs_type: pt_sfc
    variables:
      temperature:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Temperature (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 20
      dewpoint_qc:
        unit_scale: 273.15
        unit_scale_method: '+'
        ylabel_plot: 'Dewpoint (K)'
        vmin_plot: 280
        vmax_plot: 320
        vdiff_plot: 5
        nlevels_plot: 15

plots: 
  # need a seperate plot / fix for this as it cant reaad from the paired? 
  soverlay_th:
    type: 'spatial_overlay'
    fig_kwargs: {states: false, counties: false, extent: [96.0, 107.0, 4.0, 22.0], figsize: [8, 6]}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['Thailand']
    data: ['thailand_bma_cam-chem-se-merra2', "thailand_bma_cam-chem-se-era5"]
    data_proc: {rem_obs_nan: true, set_axis: true}

  soverlay_ph:
    type: 'spatial_overlay'
    fig_kwargs: {states: false, counties: false, extent: [115.0, 128.0, 3.0, 23.0], figsize: [8, 6]}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['Philippines']
    data: ['philippines_aws_cam-chem-se-merra2', 'philippines_aws_cam-chem-se-era5']
    data_proc: {rem_obs_nan: true, set_axis: true}



