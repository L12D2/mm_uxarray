    group_by: plotname     # tile same <grp>.<type>.<var> across flight subdirs
    search: '*/*.png'      # per-flight subdirectories
    cols: 6
    thumb_width: 420
    
  debug: false

  
#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se-era5:
    files: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.*-03600.nc
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 200000

    mapping: #model species name : obs species name
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'        

    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

  cam-chem-se-merra2: 
    files: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.*-03600.nc
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    
    radius_of_influence: 200000

    # extra_calc: # Add more complex calculations and their associated variables here.
    #   dewpoint:
    #     pres_calc: "PS"
    #     specific_hum: "Q"
        
    mapping: #model species name : obs species name
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'    
        
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'magenta'
      marker: 'x'
      linestyle: '--'

      
