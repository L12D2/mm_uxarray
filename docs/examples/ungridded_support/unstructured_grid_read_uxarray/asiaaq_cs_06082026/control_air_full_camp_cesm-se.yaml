
#-------------------------------------------------------------------
# Universal comparison variables
analysis:
  start_time: '2024-03-29'          #UTC
  end_time: '2024-03-31 23:59:00'          #UTC
  
  output_dir: 
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/air_full_plot
  output_dir_save: 
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/air_full_plot
  output_dir_read: 
    /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/asiaaq_cs_06082026/output/dc8_full_camp_pair

  read:
    paired:
      method: 'netcdf'
      filenames: 
        dc8_cam-chem-se-era5:   []
        dc8_cam-chem-se-merra2: []
  download_maps: false 
  debug: false

  
#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se-era5:
    files: ''
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 200000
        
    mapping:
      
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'

    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

  cam-chem-se-merra2: 
    files: []
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    
    radius_of_influence: 200000

    # extra_calc: # Add more complex calculations and their associated variables here.
    #   dewpoint:
    #     pres_calc: "PS"
    #     specific_hum: "Q"
        
    mapping:

      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'
        
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'magenta'
      marker: 'x'
      linestyle: '--'

      
#-------------------------------------------------------------------
# Observation definitions
obs:

  dc8:
    filename: ''
    obs_type: aircraft

    variables:
      pressure_obs: {}
      altitude: {}
      O3:  {unit_scale: 1,  unit_scale_method: '*' }
      CO:  {unit_scale: 1,  unit_scale_method: '*' }
      NO2: {unit_scale: 0.001, unit_scale_method: '*' }

        
        
#-------------------------------------------------------------------

plots:

  bx_dc8:
    type: 'boxplot'
    fig_kwargs:
      figsize: [8, 6]
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc: {rem_obs_nan: true, set_axis: true}
    
  ts_dc8:
    type: 'timeseries'
    fig_kwargs: {figsize: [12, 6]}
    text_kwargs: {fontsize: 18.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc: {rem_obs_nan: true, ts_select_time: 'time', ts_avg_window: null, set_axis: false}

  vp_dc8:
    type: 'vertprofile'
    fig_kwargs: {figsize: [10, 14]}
    default_plot_kwargs: {linewidth: 4.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    ylabel_vert: 'Altitude (m)'              # top-level
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc:
      rem_obs_nan: True
      set_axis: False
      interquartile_style: 'shading'         # "box"
    altitude_variable: altitude              # top-level; your obs altitude (m)
    vertprofile_bins:                        # a DICT with range, not a list
      range:
        start: 0
        stop: 12000
        step: 1000

  scatter_dc8:
    type: 'scatter_density'
    fig_kwargs: {figsize: [10, 10]}
    default_plot_kwargs: {linewidth: 4.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc:
      rem_obs_nan: True
      set_axis: False        # set True + vmin_x/vmax_x/vmin_y/vmax_y to fix axes
    xlabel: 'Model'
    ylabel: 'Observation'
    title: 'DC8 Scatter Density'
    fill: True
    shade_lowest: True

  taylor_dc8:
    type: 'taylor'
    fig_kwargs: {figsize: [8, 8]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc: {rem_obs_nan: true, set_axis: true}

###-----------------------------------------------------------------------------
stats:
  stat_list: ['MB', 'ME', 'RMSE', 'NMB', 'NME', 'R2']
  round_output: 3
  output_table: true
  domain_type: ['all']
  domain_name: ['DC8']
  data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
  
