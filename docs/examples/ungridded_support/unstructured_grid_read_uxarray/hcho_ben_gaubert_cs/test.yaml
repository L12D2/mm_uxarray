analysis:
  start_time: '2024-06-01'                 #UTC  
  end_time:   '2024-06-01 23:59:00'        #UTC
  
  output_dir: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test
  output_dir_save: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test
  output_dir_read: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test
  
  save:
    paired: {method: 'netcdf', prefix: 'test', data: all}
  
  read:
    paired:
      method: 'netcdf'
      filenames:
        
        tempo_l2_hcho_cam-chem-se: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test/202406*_tempo_l2_hcho_cam-chem-se.nc4']
