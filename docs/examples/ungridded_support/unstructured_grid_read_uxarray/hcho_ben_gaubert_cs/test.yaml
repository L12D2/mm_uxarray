        tropomi_l2_no2_cam-chem-se: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test/202406*_tropomi_l2_no2_cam-chem-se.nc4']
        tropomi_l2_hcho_cam-chem-se: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test/202406*_tropomi_l2_hcho_cam-chem-se.nc4']
        tropomi_l2_co_cam-chem-se: ['/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test/202406*_tropomi_l2_co_cam-chem-se.nc4']
        
  debug: false

  # add this as example to yaml 
  montage:
    plot_dir: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/test # where are the single images written too
