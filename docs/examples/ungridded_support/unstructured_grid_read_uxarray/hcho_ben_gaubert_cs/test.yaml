  tropomi_l2_no2:
    regrid_target: [model, obs]   # default 'model'; 'obs' = lat/lon L3 grid
    obs_grid_res: 7
    obs_grid_extent: [-130, -60, 20, 55] # [lonW, lonE, latS, latN]; default = model extent
    obs_grid_units: km            # 'deg' (default) | 'km' | 'm'
    
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_no2
    regrid_method: nearest_s2d
    filename: /glade/derecho/scratch/lcthompson/tropomi/no2_2024/S5P_OFFL_L2__NO2____20240601*.nc
    variables:
      qa_value: {}
      nitrogendioxide_tropospheric_column: {ylabel_plot: 'NO2 trop. column', vmin_plot: 0, vmax_plot: 1.0e+16}
      averaging_kernel: {}
      air_mass_factor_troposphere: {}
      air_mass_factor_total: {}
      tm5_tropopause_pressure: {}
      latitude_bounds: {}
      longitude_bounds: {}
      qa_value: {}

  tropomi_l2_hcho:
    regrid_target: [model, obs]   # default 'model'; 'obs' = lat/lon L3 grid
    obs_grid_res: 7
    obs_grid_extent: [-130, -60, 20, 55] # [lonW, lonE, latS, latN]; default = model extent
    obs_grid_units: km            # 'deg' (default) | 'km' | 'm'
    
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_hcho
    regrid_method: nearest_s2d # nearest_s2d #conservative
    filename: /glade/derecho/scratch/lcthompson/tropomi/hcho_2024/S5P_OFFL_L2__HCHO___20240601*.nc
    # /glade/campaign/acom/acom-da/sma/TROPOMI-HCHO-DATA/2024/S5P_OFFL_L2__HCHO___202403*.nc
    # filename: /glade/campaign/acom/acom-da/sma/TROPOMI-HCHO-DATA/2024/S5P_OFFL_L2__HCHO___202406*.nc
    # filename: /glade/campaign/acom/acom-da/sma/TROPOMI-HCHO-DATA/2024/S5P_OFFL_L2__HCHO___202403*.nc
    # filename: /glade/campaign/acom/acom-da/sma/TROPOMI-HCHO-DATA/2024/S5P_OFFL_L2__HCHO___20240315*.nc
    variables:
      qa_value: {qa_min: 0.5}
      formaldehyde_tropospheric_vertical_column: 
        ylabel_plot: 'HCHO column'
        vmin_plot: 0
        vmax_plot: 3.0e+16
        nlevels_plot: 21
      averaging_kernel: {}
      formaldehyde_tropospheric_air_mass_factor: {}
      surface_pressure: {}
      tm5_constant_a: {}
      tm5_constant_b: {}
      latitude_bounds: {}
      longitude_bounds: {}

  tropomi_l2_co:
    regrid_target: [model, obs]   # default 'model'; 'obs' = lat/lon L3 grid
    obs_grid_res: 7
    obs_grid_extent: [-130, -60, 20, 55] # [lonW, lonE, latS, latN]; default = model extent
    obs_grid_units: km            # 'deg' (default) | 'km' | 'm'
    
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_co
    regrid_method: nearest_s2d # nearest_s2d #conservative
    filename: /glade/derecho/scratch/lcthompson/tropomi/co_2024/S5P_OFFL_L2__CO_____20240601*.nc #/glade/derecho/scratch/lcthompson/tropomi/co_2024/S5P_OFFL_L2__CO___202406*.nc
    variables:
      qa_value: {qa_min: 0.5}
      carbonmonoxide_total_column: 
        ylabel_plot: 'CO column'
        vmin_plot: 0
        vmax_plot: 3.0e+18
        nlevels_plot: 21
      column_averaging_kernel: {}
      pressure_levels: {}
      latitude_bounds: {}
      longitude_bounds: {}

      #  data: ['tempo_l2_hcho_cam-chem-se', 'tempo_l2_no2_cam-chem-se', 'tropomi_l2_no2_cam-chem-se', 'tropomi_l2_hcho_cam-chem-se', 'tropomi_l2_co_cam-chem-se']
      # data: ["tempo_l2_hcho_cam-chem-se"]

      # data: ["tempo_l2_hcho_cam-chem-se", 'tropomi_l2_hcho_cam-chem-se']
      
model:
  cam-chem-se:
    files: /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-06-01-03600.nc

      
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne0CONUSne30x8/ne0CONUS_ne30x8_np4_SCRIP.nc"
    mod_type: 'cesm_se' 
    mapping:
      # tempo_l2_hcho:  {CH2O: "vertical_column"}
      # tempo_l2_no2:   {NO2:  "vertical_column_troposphere"}
      tropomi_l2_no2: {NO2:  "nitrogendioxide_tropospheric_column"}    
      tropomi_l2_hcho: {CH2O: "formaldehyde_tropospheric_vertical_column"}
      tropomi_l2_co: {CO: "carbonmonoxide_total_column"}
    projection: ~
    mod_kwargs:
      convert_to_ppb: True
    plot_kwargs: {color: 'purple', marker: '^', linestyle: 'dotted'}

