  method:  conservative
  min_obs: 3
  products: [obsgrid, swath]
  instruments:
    tempo:   {res: 0.03, species: [hcho, no2]}
    tropomi: {res: 0.05, species: [no2, hcho, co]}
  cities:
    nonbiog: [atl, dfw, la, den]
    biog:    [atl, dfw, la, den]
    grapes:  [atl, dfw, la, den]
    mxcat:   [atl, mex]

