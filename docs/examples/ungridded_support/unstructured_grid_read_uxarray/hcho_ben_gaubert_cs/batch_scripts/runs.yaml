
# Per-run overrides applied to control_master.yaml by make_controls.py.
# Everything NOT listed here (obs blocks, plots, stats, mapping) lives in
# the master and is shared by all runs 

master: control_master.yaml

nicknames:
  nonbiog: "MUSICAv0-CONUS (nonbiog)"
  biog:    "MUSICAv0-CONUS (REF)"
  grapes:  "MUSICAv0-CONUS (GRA2PESv2)"
  mxcat:   "MUSICAv0-HAMAQ (REF)"
  
# common domain across all model runs. Add additional domains under "add_domains"
common:
  add_domains:
    ATL_metro: {bounds: [-85.85, -82.85, 32.3, 35.3]}
    # {bounds: [-85.0, -83.7, 33.2, 34.4]}
    # [32.4,  -86.0,  35.4,  -82.0]
    MEX_metro: {bounds: [-100.6, -97.6, 17.95, 20.95]}
    SE_US: {bounds: [-92.0, -75.0, 24.5, 37.0]}
    LA_metro:  {bounds: [-119.75, -116.75, 32.5, 35.5]}
    DEN_metro: {bounds: [-106.55, -103.55, 38.25, 41.25]}
    DFW_metro: {bounds: [-98.55, -95.55, 31.3, 34.3]}
    CONUS:      # 'all' domain

    # MEX_greater: {bounds: [-100.0, -98.2, 18.5, 20.4]}
    # SE_US:       {bounds: [-92.0, -75.0, 24.5, 37.0]}
    # LA_greater:  {bounds: [-119.6, -116.9, 33.0, 35.0]}
    # DEN_greater: {bounds: [-106.2, -103.9, 38.8, 40.7]}
    # DFW_greater: {bounds: [-98.2, -95.9, 31.8, 33.8]}

# surface point obs (AirNow + AQS) vs CESM-SE. Renders control_{run}_sfc.yaml
# from control_sfc_master.yaml. paired_dir + scrip_file reuse the base run;
# each run supplies its paired prefix, plot dir, and full-month model glob
# (surface pairing needs the month, unlike the single-file plotting grid).

sfc:
  master: control_sfc_master.yaml
  runs:
    nonbiog:
      prefix:   202406_sfc
      plot_dir: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/figs/nonbiog/sfc
