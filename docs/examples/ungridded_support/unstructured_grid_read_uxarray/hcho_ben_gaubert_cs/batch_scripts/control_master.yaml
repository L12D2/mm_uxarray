
# MELODIES-MONET master control template
# TEMPO/TROPOMI L2 columns vs CESM-SE (CAM-chem)
# Shared across all emission-scenario runs. 

# Per-run paths/model/scrip/domains come from runs.yaml via make_controls.py -- do NOT run this file directly.

# when you update this yaml run: 
# python make_controls.py                      # control_{nonbiog,biog,grapes,mxcat}.yaml

analysis:
  start_time: '2024-06-01'                 # UTC
  end_time:   '2024-06-30 23:59:00'        # UTC

  # placeholders -- make_controls.py overwrites these per run
  output_dir:      /glade/work/lcthompson/mm_output/PLACEHOLDER
  output_dir_save: /glade/work/lcthompson/mm_output/PLACEHOLDER
  output_dir_read: /glade/work/lcthompson/mm_output/PLACEHOLDER

  save:
    paired: {method: 'netcdf', prefix: '202406', data: all}

  read:
    paired:
      method: 'netcdf'
      # filenames repointed per run by make_controls.py (<paired_dir>/<prefix>*_<label>.nc4)
      filenames:
        tempo_l2_hcho_cam-chem-se:           ['PLACEHOLDER']
        tempo_l2_hcho_cam-chem-se_obsgrid:   ['PLACEHOLDER']
        tempo_l2_hcho_cam-chem-se_series:    ['PLACEHOLDER']
        tempo_l2_no2_cam-chem-se:            ['PLACEHOLDER']
        tempo_l2_no2_cam-chem-se_obsgrid:    ['PLACEHOLDER']
        tempo_l2_no2_cam-chem-se_series:     ['PLACEHOLDER']
        tropomi_l2_no2_cam-chem-se:          ['PLACEHOLDER']
        tropomi_l2_no2_cam-chem-se_obsgrid:  ['PLACEHOLDER']
        tropomi_l2_no2_cam-chem-se_series:   ['PLACEHOLDER']
        tropomi_l2_hcho_cam-chem-se:         ['PLACEHOLDER']
        tropomi_l2_hcho_cam-chem-se_obsgrid: ['PLACEHOLDER']
        tropomi_l2_hcho_cam-chem-se_series:  ['PLACEHOLDER']
        tropomi_l2_co_cam-chem-se:           ['PLACEHOLDER']
        tropomi_l2_co_cam-chem-se_obsgrid:   ['PLACEHOLDER']
        tropomi_l2_co_cam-chem-se_series:    ['PLACEHOLDER']

  debug: false

  montage:
    plot_dir: /glade/work/lcthompson/mm_output/PLACEHOLDER          # overwritten per run
    outdir:   /glade/work/lcthompson/mm_output/PLACEHOLDER/montages # overwritten per run
    group_by: type          # "all" | "plotname" | "type"
    search: "*.png"
    cols: 6
    thumb_width: 420

obs:
  tempo_l2_hcho:
    obs_type: sat_swath_clm
    sat_type: tempo_l2_hcho
    regrid_method: radius_mean
    filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_202406*_S*
    regrid_target: [obs, model, series]     # 'model' = mesh; 'obs' = lat/lon L3; 'series' = weighted CONUS mean
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 20, 55]    # [lonW, lonE, latS, latN] for the obs/series targets only
    obs_grid_units: deg                     # 'deg' | 'km' | 'm'
    variables:
      main_data_quality_flag: {main_data_quality_flag_max: 0, var_applied: ['vertical_column']}
      vertical_column:
        ylabel_plot: 'HCHO column (molec cm$^{-2}$)'
        vmin_plot: 0.3
        vmax_plot: 3.0e+16
        nlevels_plot: 21
      pressure: {}
      scattering_weights: {}
      amf: {}
      latitude_bounds: {}
      longitude_bounds: {}
      vertical_column_uncertainty: {}

  tempo_l2_no2:
    obs_type: sat_swath_clm
    sat_type: tempo_l2_no2
    regrid_method: radius_mean
    filename: /glade/campaign/acom/acom-da/sma/TEMPO_NO2_V03/TEMPO_NO2_L2_V03_202406*_S0*
    regrid_target: [obs, model, series]
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 20, 55]
    obs_grid_units: deg
    variables:
      main_data_quality_flag: {main_data_quality_flag_max: 0, var_applied: ['vertical_column_troposphere']}
      vertical_column_troposphere: {ylabel_plot: 'NO$_2$ trop. column (molec cm$^{-2}$)', vmin_plot: 0, vmax_plot: 1.0e+16}
      pressure: {}
      tropopause_pressure: {}
      scattering_weights: {}
      amf_troposphere: {}
      latitude_bounds: {}
      longitude_bounds: {}
      vertical_column_troposphere_uncertainty: {}

  tropomi_l2_no2:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_no2
    regrid_method: radius_mean
    filename: /glade/derecho/scratch/lcthompson/tropomi/no2_2024/S5P_OFFL_L2__NO2____202406*.nc
    regrid_target: [obs, model, series]
    obs_grid_res: 0.1
    obs_grid_units: deg
    variables:
      qa_value: {}
      nitrogendioxide_tropospheric_column: {ylabel_plot: 'NO$_2$ trop. column (molec cm$^{-2}$)', vmin_plot: 0, vmax_plot: 1.0e+16}
      averaging_kernel: {}
      air_mass_factor_troposphere: {}
      air_mass_factor_total: {}
      tm5_tropopause_pressure: {}
      latitude_bounds: {}
      longitude_bounds: {}
      nitrogendioxide_tropospheric_column_precision: {}

  tropomi_l2_hcho:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_hcho
    regrid_method: radius_mean
    filename: /glade/derecho/scratch/lcthompson/tropomi/hcho_2024/S5P_OFFL_L2__HCHO___202406*.nc
    regrid_target: [obs, model, series]
    obs_grid_res: 0.1
    obs_grid_units: deg
    variables:
      qa_value: {qa_min: 0.5}
      formaldehyde_tropospheric_vertical_column:
        ylabel_plot: 'HCHO column (molec cm$^{-2}$)'
        vmin_plot: 0.3
        vmax_plot: 2.0e+16
        nlevels_plot: 21
      averaging_kernel: {}
      formaldehyde_tropospheric_air_mass_factor: {}
      surface_pressure: {}
      tm5_constant_a: {}
      tm5_constant_b: {}
      latitude_bounds: {}
      longitude_bounds: {}
      formaldehyde_tropospheric_vertical_column_precision: {}

  tropomi_l2_co:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_co
    regrid_method: radius_mean
    filename: /glade/derecho/scratch/lcthompson/tropomi/co_2024/S5P_OFFL_L2__CO_____202406*.nc
    regrid_target: [obs, model, series]
    obs_grid_res: 0.1
    obs_grid_units: deg
    variables:
      qa_value: {qa_min: 0.5}
      carbonmonoxide_total_column:
        ylabel_plot: 'CO column (molec cm$^{-2}$)'
        vmin_plot: 0
        vmax_plot: 3.0e+18
        nlevels_plot: 21
      column_averaging_kernel: {}
      pressure_levels: {}
      latitude_bounds: {}
      longitude_bounds: {}
      carbonmonoxide_total_column_precision: {}
      carbonmonoxide_total_column_corrected: {}

model:
  cam-chem-se:
    # single timestep is enough ; plotting from paired only needs the mesh; make_controls.py overwrites per run
    files: PLACEHOLDER
    scrip_file: PLACEHOLDER
    mod_type: 'cesm_se'
    mapping:
      tempo_l2_hcho:   {CH2O: "vertical_column"}
      tempo_l2_no2:    {NO2:  "vertical_column_troposphere"}
      tropomi_l2_no2:  {NO2:  "nitrogendioxide_tropospheric_column"}
      tropomi_l2_hcho: {CH2O: "formaldehyde_tropospheric_vertical_column"}
      tropomi_l2_co:   {CO:   "carbonmonoxide_total_column"}
    projection: ~
    mod_kwargs:
      convert_to_ppb: True
    plot_kwargs: {color: 'purple', marker: '^', linestyle: 'dotted'}

plots:

  grp8_multibox_dow_tempo_no2:
    type: 'multi_boxplot'
    fig_kwargs: {figsize: [10, 6]}
    text_kwargs: {fontsize: 16}
    domain_type:
    domain_name:
    domain_info:
    data: ['tempo_l2_no2_cam-chem-se']
    interval_var: dayofweek
    interval_list: [0, 1, 2, 3, 4, 5, 6, 7]
    interval_labels: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    xlabel: 'Day of week'
    data_proc: {rem_obs_nan: True, set_axis: False, hour_range: [13, 14], hour_basis: solar}

  grp8_multibox_dow_tropomi_no2:
    type: 'multi_boxplot'
    fig_kwargs: {figsize: [10, 6]}
    text_kwargs: {fontsize: 16}
