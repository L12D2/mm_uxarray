# MELODIES-MONET SURFACE master (AirNow + AQS vs CESM-SE / CAM-chem).

# from runs.yaml (sfc: section) via make_controls.py -- do NOT run directly.
# Domains are left empty here on purpose: make_controls injects every domain

# from runs.yaml common.add_domains (CONUS + the metro boxes).

analysis:
  start_time: '2024-06-01'                 # UTC
  end_time:   '2024-06-30 23:59:00'        # UTC

  # placeholders -- make_controls.py overwrites these per run
  output_dir:      PLACEHOLDER
  output_dir_save: PLACEHOLDER
  output_dir_read: PLACEHOLDER

  save:
    paired: {method: 'netcdf', prefix: PLACEHOLDER, data: all}

  read:
    paired:
      method: 'netcdf'
      filenames:                            # repointed per run by make_controls.py
        airnow_cam-chem-se: ['PLACEHOLDER']
        aqs_cam-chem-se:    ['PLACEHOLDER']

  debug: false

  montage:
    plot_dir: PLACEHOLDER
    outdir:   PLACEHOLDER
    group_by: type
    search: "*.png"
    cols: 6
    thumb_width: 420

obs:
  aqs:
    use_aqs: True
    obs_type: pt_sfc
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/output/AQS_20240601_20240701.nc
    variables:
      OZONE:
        unit_scale: 1000
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: 'Ozone (PPB)'
        ylabel_reg_plot: 'MDA8 O3 (ppbv)'
        nlevels_plot: 256
        vmin_plot: 0
        vmax_plot: 90
        regulatory: True
      PM2.5:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: 'PM2.5 (ug/m3)'
        ylabel_reg_plot: 'PM2.5_24hr (ug/m3)'
        vmin_plot: 0
        vmax_plot: 60
        nlevels_plot: 256
        regulatory: True

  airnow:
    use_airnow: True
    obs_type: pt_sfc
    filename: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/output/AirNow_20240601_20240701.nc
    variables:
      NO2:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: 'NO2 (PPB)'
        vmin_plot: 0
        vmax_plot: 40
        nlevels_plot: 256
      PM2.5:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: 'PM2.5 (ug/m3)'
        ylabel_reg_plot: 'PM2.5_24hr (ug/m3)'
        vmin_plot: 0
        vmax_plot: 60
        nlevels_plot: 256
        regulatory: True
      OZONE:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -1.0
        # ylabel_plot: 'Ozone (PPB)'
        vmin_plot: 0
        vmax_plot: 90
        nlevels_plot: 256
        regulatory: True
        ylabel_plot: 'Ozone (PPB)'
        ylabel_reg_plot: 'MDA8 O3 (ppbv)'
      TEMP:
        unit_scale: 273.15
        unit_scale_method: '+'
        nan_value: -1.0
        ylabel_plot: 'Temperature (K)'
        vmin_plot: 280
        vmax_plot: 315
        nlevels_plot: 256

model:
  cam-chem-se:
    files: PLACEHOLDER
    scrip_file: PLACEHOLDER
    mod_type: 'cesm_se'
    mapping:
      airnow: {NO2: "NO2", T: "TEMP", PM25: "PM2.5", O3: "OZONE"}
      aqs:    {O3: "OZONE", PM25: "PM2.5"}
    projection: ~
    mod_kwargs:
      convert_to_ppb: True
    plot_kwargs: {color: 'purple', marker: '^', linestyle: 'dotted'}

plots:

  regulatory_dow_anw:
    type: 'multi_boxplot'
    fig_kwargs: {figsize: [8, 6]}
    text_kwargs: {fontsize: 16}
    domain_type:
    domain_name:
    domain_info:
    data: ["airnow_cam-chem-se"]
    interval_var: dayofweek
    interval_list: [0, 5, 7]              # Mon=0..Sun=6 ; [0,5)=weekday, [5,7)=weekend
    interval_labels: [weekday, weekend]
    xlabel: 'Day type'
    data_proc: {rem_obs_nan: True, set_axis: True}

  regulatory_dow_aqs:
    type: 'multi_boxplot'
    fig_kwargs: {figsize: [8, 6]}
    text_kwargs: {fontsize: 16}
    domain_type:
    domain_name:
    domain_info:
    data: ["aqs_cam-chem-se"]
    interval_var: dayofweek 
    interval_list: [0, 5, 7]
    interval_labels: [weekday, weekend]
    xlabel: 'Day type'
    data_proc: {rem_obs_nan: True, set_axis: True}

  regulatory_dow1x_anw:
    type: 'multi_boxplot'
    fig_kwargs: {figsize: [10, 6]}
    text_kwargs: {fontsize: 16}
    domain_type:
    domain_name:
    domain_info:
    data: ["airnow_cam-chem-se"]
    interval_var: dayofweek
    interval_list: [0, 1, 2, 3, 4, 5, 6, 7]        # Mon=0..Sun=6 ; one bin per day
    interval_labels: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    xlabel: 'Day of week'
    data_proc: {rem_obs_nan: True, set_axis: True}

  regulatory_dow1x_aqs:
    type: 'multi_boxplot'
    fig_kwargs: {figsize: [10, 6]}
    text_kwargs: {fontsize: 16}
    domain_type:
    domain_name:
    domain_info:
    data: ["aqs_cam-chem-se"]
    interval_var: dayofweek
    interval_list: [0, 1, 2, 3, 4, 5, 6, 7]
    interval_labels: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    xlabel: 'Day of week'
    data_proc: {rem_obs_nan: True, set_axis: True}
    
  regulatory_spatial_bias_anw:
    type: 'spatial_bias'
    fig_kwargs: {figsize: [12, 6], states: True, counties: True}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    domain_type:      # injected from common.add_domains
    domain_name:
    domain_info:
    data: ["airnow_cam-chem-se"]
    data_proc: {rem_obs_nan: True, set_axis: True}

  regulatory_spatial_bias_ex_anw:
    type: 'spatial_bias_exceedance'
    fig_kwargs: {figsize: [12, 6], states: True, counties: True}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    domain_type:      # injected from common.add_domains
    domain_name:
    domain_info:
    data: ["airnow_cam-chem-se"]
    data_proc: {rem_obs_nan: True, set_axis: True}
    
  regulatory_spatial_bias_aqs:
    type: 'spatial_bias'
    fig_kwargs: {figsize: [12, 6], states: True, counties: True}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    domain_type:      # injected from common.add_domains
