stats:
  stat_list: ["MB", "MdnB", "R2", "RMSE"]
  round_output: 2
  output_table: False
  domain_type:
  domain_name:
  domain_info:
  data: ["airnow_cam-chem-se", "aqs_cam-chem-se"]
