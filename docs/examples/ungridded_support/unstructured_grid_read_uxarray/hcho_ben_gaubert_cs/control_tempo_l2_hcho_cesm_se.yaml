analysis:
  start_time: '2024-06-01'                 #UTC  
  end_time:   '2024-06-30 23:59:00'        #UTC
    
  output_dir: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/satellite_img
  output_dir_save: /glade/work/lcthompson/mm_output/nonbiog_refera5_dust
  output_dir_read: /glade/work/lcthompson/mm_output/nonbiog_refera5_dust 
  
  save:
    paired: {method: 'netcdf', prefix: '202406', data: all}
  
  read:
    paired:
      method: 'netcdf'
      filenames:
        # TEMPO HCHO 
        tempo_l2_hcho_cam-chem-se:          ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tempo_l2_hcho_cam-chem-se.nc4']
        tempo_l2_hcho_cam-chem-se_obsgrid:  ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tempo_l2_hcho_cam-chem-se_obsgrid.nc4']
        tempo_l2_hcho_cam-chem-se_series:   ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tempo_l2_hcho_cam-chem-se_series.nc4']

        # TEMPO NO2 
        tempo_l2_no2_cam-chem-se:           ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tempo_l2_no2_cam-chem-se.nc4']
        tempo_l2_no2_cam-chem-se_obsgrid:   ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tempo_l2_no2_cam-chem-se_obsgrid.nc4']
        tempo_l2_no2_cam-chem-se_series:    ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tempo_l2_no2_cam-chem-se_series.nc4']

        # TROPOMI NO2
        tropomi_l2_no2_cam-chem-se:         ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_no2_cam-chem-se.nc4']
        tropomi_l2_no2_cam-chem-se_obsgrid: ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_no2_cam-chem-se_obsgrid.nc4']
        tropomi_l2_no2_cam-chem-se_series:  ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_no2_cam-chem-se_series.nc4']

        # TROPOMI HCHO
        tropomi_l2_hcho_cam-chem-se:        ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_hcho_cam-chem-se.nc4']
        tropomi_l2_hcho_cam-chem-se_obsgrid: ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_hcho_cam-chem-se_obsgrid.nc4']
        tropomi_l2_hcho_cam-chem-se_series: ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_hcho_cam-chem-se_series.nc4']

        # TROPOMI CO 
        tropomi_l2_co_cam-chem-se:          ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_co_cam-chem-se.nc4']
        tropomi_l2_co_cam-chem-se_obsgrid:  ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_co_cam-chem-se_obsgrid.nc4']
        tropomi_l2_co_cam-chem-se_series:   ['/glade/work/lcthompson/mm_output/nonbiog_refera5_dust/202406*_tropomi_l2_co_cam-chem-se_series.nc4']
        
        
  debug: false

  # add this as example to yaml 
  montage:
    plot_dir: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/satellite_img # where are the single images written too
    outdir: /glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/hcho_ben_gaubert_cs/satellite_img/montages # where do you want the montages written too
    group_by: type     # puts all outputted figs in montage
    # options include: "all", "plotname", "type"
    search: "*.png"
    cols: 6
    thumb_width: 420

