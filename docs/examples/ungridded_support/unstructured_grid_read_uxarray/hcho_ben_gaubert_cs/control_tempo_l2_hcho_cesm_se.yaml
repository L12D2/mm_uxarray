plots:
  plot_grp1:
    type: 'timeseries'
    fig_kwargs: {figsize: [12, 6]}
    default_plot_kwargs: {linewidth: 2.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    
    domain_type: ["all", "auto-region:giorgi", "auto-region:box"]
    domain_name: ["CONUS", "CNA", "SE_US"]
    domain_info:
      SE_US: {bounds: [-92.0, -75.0, 24.5, 37.0]}

    data: ["tempo_l2_hcho_cam-chem-se", 'tropomi_l2_hcho_cam-chem-se']
    data_proc:
      ts_offset: (-4, 'h')
      ts_avg_window: 'h'
      set_axis: true

  plot_grp2:
    type: 'gridded_spatial_bias'
    fig_kwargs: {states: true, counties: false}
    text_kwargs: {fontsize: 16}
    
