obs:
  tempo_l2_hcho:
    regrid_method: radius_mean #nearest_s2d # conservative
    #filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_20240630T*_S0*
    #filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_202403*_S*
    filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_202406*_S*
    # filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_202403*_S*
    # filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_20240315*_S*
    
    regrid_target: [obs, model]   #[model, obs]   # default 'model'; 'obs' = lat/lon L3 grid
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 15, 55] # [lonW, lonE, latS, latN]; default = model extent
    obs_grid_units: deg            # 'deg' (default) | 'km' | 'm'
    
    obs_type: sat_swath_clm
    sat_type: tempo_l2_hcho
    variables:
      main_data_quality_flag: {}
      solar_zenith_angle: {}
      # inside the {} to save it out do {save: True}
      eff_cloud_fraction: {}
      vertical_column:
        ylabel_plot: 'HCHO column (molec cm$^{-2}$)'
        vmin_plot: 0.3
        vmax_plot: 2.0e+16
        nlevels_plot: 21
      pressure: {}
      scattering_weights: {}
      amf: {}
      latitude_bounds: {}
      longitude_bounds: {}
      vertical_column_uncertainty: {}
    data_proc:
      filter_dict:
        main_data_quality_flag: {oper: '<=', value: 0}
        solar_zenith_angle:     {oper: '<=', value: 70}
        eff_cloud_fraction:     {oper: '<=', value: 0.2}
      
  tempo_l2_no2:
    obs_type: sat_swath_clm
    sat_type: tempo_l2_no2
    regrid_method: radius_mean

    regrid_target: [obs, model]     # default 'model'; 'obs' = lat/lon L3 grid
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 15, 55] # [lonW, lonE, latS, latN]; default = model extent
    obs_grid_units: deg            # 'deg' (default) | 'km' | 'm'
    
    filename: /glade/campaign/acom/acom-da/sma/TEMPO_NO2_V03/TEMPO_NO2_L2_V03_202406*_S0*
    variables:
      main_data_quality_flag: {}       
      eff_cloud_fraction:     {}     
      solar_zenith_angle:     {}       
      pressure: {}
      tropopause_pressure: {}
      scattering_weights: {}
      amf_troposphere: {}
      latitude_bounds: {}
      longitude_bounds: {}
      vertical_column_troposphere_uncertainty: {}
      vertical_column_troposphere: {ylabel_plot: 'NO$_2$ trop. column (molec cm$^{-2}$)', vmin_plot: 0, vmax_plot: 1.0e+16}
    data_proc:
      filter_dict:
        main_data_quality_flag: {oper: '<=', value: 0}    # flag == 0
        solar_zenith_angle:     {oper: '<=', value: 70}
        eff_cloud_fraction:     {oper: '<=', value: 0.2}
  
  tropomi_l2_no2:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_no2
    regrid_method: radius_mean
    regrid_target: [obs, model]
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 15, 55]
    obs_grid_units: deg
    filename: /glade/derecho/scratch/lcthompson/tropomi/no2_2024/S5P_OFFL_L2__NO2____202406*.nc
    variables:
      qa_value: {}
      nitrogendioxide_tropospheric_column: {ylabel_plot: 'NO$_2$ trop. column (molec cm$^{-2}$)', vmin_plot: 0, vmax_plot: 1.0e+16}
      averaging_kernel: {}
      air_mass_factor_troposphere: {}
      air_mass_factor_total: {}
      tm5_tropopause_pressure: {}
      latitude_bounds: {}
      longitude_bounds: {}
      nitrogendioxide_tropospheric_column_precision: {}
    data_proc:
      filter_dict:
        qa_value: {oper: '>=', value: 0.75}      # NO2 standard

  tropomi_l2_hcho:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_hcho
    regrid_method: radius_mean
    regrid_target: [obs, model]
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 15, 55]
    obs_grid_units: deg
    filename: /glade/derecho/scratch/lcthompson/tropomi/hcho_2024/S5P_OFFL_L2__HCHO___202406*.nc
    variables:
      qa_value: {}
      formaldehyde_tropospheric_vertical_column:
        ylabel_plot: 'HCHO column (molec cm$^{-2}$)'
        vmin_plot: 0.3
        vmax_plot: 2.0e+16
        nlevels_plot: 21
      averaging_kernel: {}
      formaldehyde_tropospheric_air_mass_factor: {}
      surface_pressure: {}
      tm5_constant_a: {}
      tm5_constant_b: {}
      latitude_bounds: {}
      longitude_bounds: {}
      formaldehyde_tropospheric_vertical_column_precision: {}
    data_proc:
      filter_dict:
        qa_value: {oper: '>=', value: 0.5}       # HCHO standard

  tropomi_l2_co:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_co
    regrid_method: radius_mean
    regrid_target: [obs, model]
    obs_grid_res: 0.1
    obs_grid_extent: [-130, -60, 15, 55]
    obs_grid_units: deg
    filename: /glade/derecho/scratch/lcthompson/tropomi/co_2024/S5P_OFFL_L2__CO_____202406*.nc
    variables:
      qa_value: {}
      carbonmonoxide_total_column:
        ylabel_plot: 'CO column (molec cm$^{-2}$)'
        vmin_plot: 0
        vmax_plot: 3.0e+18
        nlevels_plot: 21
      column_averaging_kernel: {}
      pressure_levels: {}
      latitude_bounds: {}
      longitude_bounds: {}
      carbonmonoxide_total_column_precision: {}
      carbonmonoxide_total_column_corrected: {}
    data_proc:
      filter_dict:
        qa_value: {oper: '>=', value: 0.5}       # CO standard
model:
  cam-chem-se:
    # files: /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-06*.nc

    # for plotting model, it only needs a single model to get the grid. No need to load the whole month 
    files: /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-06-05-03600.nc 
    
    # /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.biog_ERA5_ref_dust_M1.1.001/H1/
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne0CONUSne30x8/ne0CONUS_ne30x8_np4_SCRIP.nc"
    mod_type: 'cesm_se' 
    mapping:
      tempo_l2_hcho:  {CH2O: "vertical_column"}
      tempo_l2_no2:   {NO2:  "vertical_column_troposphere"}
      tropomi_l2_no2: {NO2:  "nitrogendioxide_tropospheric_column"}    
      tropomi_l2_hcho: {CH2O: "formaldehyde_tropospheric_vertical_column"}
      tropomi_l2_co: {CO: "carbonmonoxide_total_column"}
    projection: ~
    mod_kwargs:
      convert_to_ppb: True
    plot_kwargs: {color: 'purple', marker: '^', linestyle: 'dotted'}

